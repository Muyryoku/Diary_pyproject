<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Diary | {% block title %}Страница{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input, textarea, select {
      color: black;
      background-color: white;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
      outline: none;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 2px #c4b5fd;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen pb-32">

  <nav class="bg-gray-800 px-6 py-4 flex justify-between items-center shadow">
    <div class="flex items-center gap-4">
      <a href="{% url 'home' %}" class="text-2xl font-bold text-purple-300">📓 Diary</a>
      <ul class="hidden md:flex gap-6 text-sm">
  <li><a href="{% url 'home' %}" class="hover:underline">📌 Главная</a></li>
  <li><a href="{% url 'about' %}" class="hover:underline">📘 О проекте</a></li>
  <li><a href="{% url 'notes' %}" class="hover:underline">📝 Заметки</a></li>
  <li><a href="{% url 'tasks' %}" class="hover:underline">🎯  Задачи</a></li>
  <li><a href="{% url 'profile' %}" class="hover:underline">👤 Профиль</a></li>
</ul>
      </ul>
    </div>

    {% if user.is_authenticated %}
  <div class="ml-auto flex items-center gap-3 bg-purple-600 px-4 py-2 rounded-full shadow text-sm">
    <span class="text-white font-semibold flex items-center gap-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A7.975 7.975 0 0112 16c2.21 0 4.21.896 5.656 2.344M15 10a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      {{ user.username }}
    </span> <form method="post" action="{% url 'logout' %}">
  {% csrf_token %}
  <button type="submit" class="flex items-center gap-2 bg-purple-700 hover:bg-purple-600 text-white px-4 py-2 rounded-full text-sm transition duration-200">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7" />
    </svg>
    Выйти
  </button>
</form>

  </div>
{% endif %}

  </nav>

  <main class="p-8">
    {% block content %}{% endblock %}
  </main>

  <div class="fixed right-4 top-1/2 bg-purple-600 w-4 h-24 rounded-lg"></div>


</body>
</html>
