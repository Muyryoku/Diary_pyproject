<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Diary | {% block title %}Страница{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    input, textarea, select {
      color: black;
      background-color: white;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
      outline: none;
      width: 100%;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 2px #c4b5fd;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen pb-32">
<a href="{% url 'logout' %}">Выйти</a>

  <nav class="bg-gray-800 px-6 py-4 flex justify-between items-center shadow">
    <div class="flex items-center gap-4">
      <a href="{% url 'home' %}" class="text-2xl font-bold text-purple-300">📓 Diary</a>
      <ul class="hidden md:flex gap-6 text-sm">
        <li><a href="{% url 'home' %}" class="hover:underline">📌 Главная</a></li>
        <li><a href="/about/" class="hover:underline">📘 О проекте</a></li>
        <li><a href="/notes/" class="hover:underline">📝 Заметки</a></li>
        <li><a href="/profile/" class="hover:underline">👤 Профиль</a></li>
      </ul>
    </div>
    <div class="flex items-center gap-4">
      {% if user.is_authenticated %}
        <span class="text-sm text-purple-400">{{ user.username }}</span>
        <a href="{% url 'logout' %}" class="text-sm hover:underline">🚪 Выйти</a>
      {% else %}
        <a href="{% url 'login' %}" class="bg-purple-600 px-4 py-2 rounded hover:bg-purple-500">🔐 Войти</a>
        <a href="{% url 'register' %}" class="border border-purple-600 px-4 py-2 rounded hover:bg-purple-600">📝 Регистрация</a>
      {% endif %}
    </div>
  </nav>

  <main class="p-8">
    {% block content %}{% endblock %}
  </main>

  <div class="fixed right-4 top-1/2 bg-purple-600 w-4 h-24 rounded-lg"></div>

  <footer class="fixed bottom-0 w-full bg-gray-700 text-white px-6 py-4 flex justify-between items-center">
    <p class="text-sm">© 2025 Diary. Все права защищены.</p>
    <button class="bg-gray-900 px-4 py-2 rounded hover:bg-gray-800">Принять cookies</button>
  </footer>
</body>
</html>
