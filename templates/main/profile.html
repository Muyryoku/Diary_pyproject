{% extends "main/base.html" %}

{% block title %}Профиль{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8 space-y-6">

  <h1 class="text-4xl font-bold text-purple-400 mb-6 flex items-center gap-2">
    <span class="text-2xl">👤</span> Мой профиль
  </h1>

  <div class="bg-gray-800 p-6 rounded-lg shadow border-l-4 border-purple-500 space-y-4">
    <div>
      <p class="text-white text-lg"><strong class="text-purple-300">Логин:</strong> {{ user.username }}</p>
      <p class="text-white text-lg"><strong class="text-purple-300">Email:</strong> {{ user.email|default:"—" }}</p>
    </div>

    <div class="pt-2">
      <a href="{% url 'logout' %}" class="inline-block bg-red-600 hover:bg-red-500 text-white px-5 py-2 rounded-full text-sm">
        🚪 Выйти из аккаунта
      </a>
    </div>
  </div>

</div>
{% endblock %}
