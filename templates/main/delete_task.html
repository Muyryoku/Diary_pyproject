{% extends "main/base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto p-6 text-center">
  <h1 class="text-3xl font-bold mb-6 text-purple-500">🗑 Удалить задачу</h1>
  <p class="mb-4 text-gray-300">Вы уверены, что хотите удалить задачу <strong>{{ task.title }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 px-4 py-2 rounded hover:bg-red-500">Удалить</button>
    <a href="{% url 'home' %}" class="ml-4 text-gray-300 hover:underline">Отмена</a>
  </form>
</div>
{% endblock %}
