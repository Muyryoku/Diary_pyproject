{% extends 'base.html' %}

{% block title %}Создание задачи{% endblock %}

{% block content %}
<h1>Создать новую задачу</h1>

<form method="POST">
  {% csrf_token %}
  <label for="title">Название задачи:</label>
  <input type="text" id="title" name="title" required><br><br>

  <button type="submit">Создать</button>
</form>

{% endblock %}
